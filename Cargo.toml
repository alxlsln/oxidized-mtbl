[package]
name = "oxidized-mtbl"
version = "0.1.0"
authors = ["Clément Renault <renault.cle@gmail.com>"]
edition = "2018"

[dependencies]
async-trait = "0.1.92"
aws-config = "1.12.0"
aws-sdk-s3 = "1.152.0"
aws-smithy-types = "1.8.1"
byteorder = "1.3.4"
crc32c = { version = "0.4.0", optional = true }
flate2 = { version = "1.0", optional = true }
indicatif = "0.18.6"
load-dotenv = "0.1.2"
log = "0.4.11"
memmap = "0.7.0"
snap = { version = "1.0.0", optional = true }
tempfile = "3.1.0"
tokio = { version =  "1.53.1", features =["fs", "io-util", "test-util", "macros", "rt"]}
tokio-stream = "0.1.19"
zstd = { version = "0.5.1", optional = true }

[dev-dependencies]
quickcheck = "0.9"

[features]
default = ["zlib", "snappy", "zstd", "checksum"]
checksum = ["crc32c"]
snappy = ["snap"]
zlib = ["flate2"]
